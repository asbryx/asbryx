  <!-- Corner flourish -->
  <path d="M 438 20 L 438 10 L 428 10" stroke="#f6c177" stroke-width="1.1" stroke-opacity="0.55" fill="none"/>

  <!-- Module Code + Title -->
  <g transform="translate(22, 20)">
    <text x="0" y="8" fill="#6e6a86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="0.12em">✟ MOD_02 // CLOB_ENGINE</text>
    <text x="0" y="28" fill="#e0def4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">polymarket-lol-bot</text>
    <text x="406" y="26" fill="#f6c177" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="end">↗</text>
  </g>

  <!-- Description -->
  <text x="22" y="70" fill="#c4c0dc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Low-latency Rust orderbook engine for Polymarket LoL</text>
  <text x="22" y="88" fill="#908caa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Esports tick telemetry and automated dip-buying execution.</text>

