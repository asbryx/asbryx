  </g>

  <!-- Description -->
  <text x="18" y="96" fill="#e0def4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Sanitized CUDA proof-of-work mining toolkit with</text>
  <text x="18" y="113" fill="#908caa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">custom GPU kernels, local signing &amp; offline tests.</text>

