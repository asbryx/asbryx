<svg width="450" height="148" viewBox="0 0 450 148" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="450" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111019"/>
      <stop offset="100%" stop-color="#191724"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="450" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ebbcba" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#26233a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9ccfd8" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="450" height="148" rx="10" fill="url(#cardBg)"/>
  <rect x="0.75" y="0.75" width="448.5" height="146.5" rx="9.25" stroke="url(#cardBorder)" stroke-width="1.3"/>

  <!-- Left glowing indicator bar -->
  <path d="M 0 22 L 3.5 22 L 3.5 52 L 0 52 Z" fill="#ebbcba"/>

  <!-- Corner flourish -->
  <path d="M 438 20 L 438 10 L 428 10" stroke="#ebbcba" stroke-width="1.1" stroke-opacity="0.55" fill="none"/>

  <!-- Module Code + Title -->
  <g transform="translate(22, 20)">
    <text x="0" y="8" fill="#6e6a86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="0.12em">✟ MOD_01 // POW_KERNEL</text>
    <text x="0" y="28" fill="#e0def4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">universal-cuda-miner</text>
    <text x="406" y="26" fill="#ebbcba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="end">↗</text>
  </g>

  <!-- Description -->
  <text x="22" y="70" fill="#c4c0dc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Reusable sanitized CUDA proof-of-work mining toolkit</text>
  <text x="22" y="88" fill="#908caa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">with local signing, custom GPU kernels, and offline verification.</text>

  <!-- Tags -->
  
