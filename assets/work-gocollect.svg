<svg width="442" height="124" viewBox="0 0 442 124" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shBlur" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    @keyframes oscRot {
      0%, 100% { transform: rotate(-25deg); }
      50% { transform: rotate(25deg); }
    }
    .wm-osc { animation: oscRot 18s ease-in-out infinite; transform-origin: 372px 62px; }

    @keyframes shimmerX {
      0%, 26% { transform: translateX(-170px); }
      64%, 100% { transform: translateX(620px); }
    }
    .shimmer { animation: shimmerX 10s linear infinite; }
  </style>

  <rect x="0.5" y="0.5" width="441" height="123" rx="6" fill="#13151b" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <rect x="1" y="0.5" width="440" height="1" fill="#9bb3c4" fill-opacity="0.3"/>

  
  <g stroke="#9bb3c4" stroke-opacity="0.12" fill="none">
    <g class="wm-osc">
      <ellipse cx="372" cy="62" rx="34" ry="15" stroke-width="1"/>
      <ellipse cx="372" cy="62" rx="34" ry="15" stroke-width="0.7" transform="rotate(90 372 62)"/>
    </g>
    <circle cx="372" cy="62" r="4" stroke-width="1"/>
  </g>


  <g class="shimmer">
    <rect x="-60" y="-10" width="90" height="144" fill="#ffffff" fill-opacity="0.04" filter="url(#shBlur)" transform="skewX(-18)"/>
  </g>

  <text x="22" y="32" fill="#f5f3f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="-0.01em">gocollect-farm</text>
  <text x="420" y="32" fill="#9a95a8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" text-anchor="end">&#8599;</text>

  <text x="22" y="58" fill="#b4afc2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">Autonomous client featuring synthetic GPS gait</text>
  <text x="22" y="76" fill="#b4afc2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">kinematics, device-motion telemetry, and SIWx auth.</text>

  <circle cx="26" cy="102" r="3" fill="#9bb3c4" fill-opacity="0.9"/>
  <text x="36" y="106" fill="#a29db0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500">JavaScript · Solana</text>
  <text x="420" y="106" fill="#827d92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" text-anchor="end">Kinematics</text>
</svg>