<svg width="900" height="36" viewBox="0 0 900 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sweepBlur" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <style>
    @keyframes sweepX {
      0%, 20% { transform: translateX(-140px); }
      66%, 100% { transform: translateX(1040px); }
    }
    .sweep { animation: sweepX 9s linear infinite; }
  </style>

  <text x="2" y="22" fill="#e2c2c8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.14em">01</text>
  <text x="34" y="22" fill="#c8c3d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.2em">SELECTED WORKS</text>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <g class="sweep">
    <rect x="0" y="33.3" width="130" height="1.4" fill="#e2c2c8" fill-opacity="0.3" filter="url(#sweepBlur)"/>
  </g>
</svg>