<svg width="442" height="124" viewBox="0 0 442 124" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shBlur" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes corePulse {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.6; }
    }
    .wm-ring { animation: ringSpin 55s linear infinite; transform-origin: 372px 62px; }
    .wm-core { animation: corePulse 6s ease-in-out infinite; }

    @keyframes shimmerX {
      0%, 26% { transform: translateX(-170px); }
      64%, 100% { transform: translateX(620px); }
    }
    .shimmer { animation: shimmerX 10s linear infinite; }
  </style>

  <rect x="0.5" y="0.5" width="441" height="123" rx="6" fill="#13151b" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <rect x="1" y="0.5" width="440" height="1" fill="#a89cc8" fill-opacity="0.3"/>

  
  <g stroke="#a89cc8" stroke-opacity="0.12" fill="none">
    <circle class="wm-ring" cx="372" cy="62" r="27" stroke-width="0.9" stroke-dasharray="4 5"/>
    <circle cx="372" cy="62" r="16" stroke-width="0.6"/>
    <line x1="337" y1="62" x2="407" y2="62" stroke-width="0.5"/>
    <line x1="372" y1="27" x2="372" y2="97" stroke-width="0.5"/>
    <circle class="wm-core" cx="372" cy="62" r="4" fill="#a89cc8" stroke="none"/>
  </g>


  <g class="shimmer">
    <rect x="-60" y="-10" width="90" height="144" fill="#ffffff" fill-opacity="0.04" filter="url(#shBlur)" transform="skewX(-18)"/>
  </g>

  <text x="22" y="32" fill="#f5f3f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="-0.01em">pixelmon-mint-racer</text>
  <text x="420" y="32" fill="#9a95a8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" text-anchor="end">&#8599;</text>

  <text x="22" y="58" fill="#b4afc2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">Direct-calldata commit-reveal minter, automated solver,</text>
  <text x="22" y="76" fill="#b4afc2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">and multi-wallet asset sweeper.</text>

  <circle cx="26" cy="102" r="3" fill="#a89cc8" fill-opacity="0.9"/>
  <text x="36" y="106" fill="#a29db0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500">Python · EVM</text>
  <text x="420" y="106" fill="#827d92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" text-anchor="end">Calldata Sniper</text>
</svg>