name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *" # Every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: asbryx
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ebbcba&color_dots=#191724,#26233a,#9ccfd8,#ebbcba,#eb6f92
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ebbcba&color_dots=#191724,#26233a,#9ccfd8,#ebbcba,#eb6f92

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
